---
name: Perform Lint and run tests

on:
  workflow_dispatch:
    inputs:

      version:
        required: false
        description: DAS-TOOLBOX version
        type: string

      architectures:
        required: false
        description: JSON array of native build architectures (amd64, arm64)
        type: string
        default: '["amd64"]'

      binary-artifact-name:
        required: false
        description: Base name of the architecture-specific artifacts
        type: string
        default: das-toolbox

  workflow_call:
    inputs:

      version:
        required: false
        description: DAS-TOOLBOX version
        type: string

      architectures:
        required: false
        description: JSON array of native build architectures (amd64, arm64)
        type: string
        default: '["amd64"]'

      run-agent-integration-tests:
        required: false
        description: Whether to run agent integration tests
        type: boolean
        default: false

      binary-artifact-name:
        required: false
        description: Specifies the name of the binary artifact to be generated or used. Default is 'das-toolbox'.
        type: string
        default: das-toolbox

  pull_request:
    types:
      - opened
      - reopened
      - edited
      - synchronize

defaults:
  run:
    shell: bash

env:
  PACKAGE_VERSION: ${{ inputs.version || '0.1.0' }}
  BINARY_ARTIFACT_NAME: ${{ inputs.binary-artifact-name || 'das-toolbox' }}

jobs:
  lint:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ~3.11
          cache: pip

      - name: Install dev requirements
        run: pip install -r src/requirements-dev.txt
        working-directory: das-cli

      - name: Run lint
        run: make lint
        working-directory: das-cli

  build-das-toolbox:
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.architectures || '["amd64"]') }}
    runs-on: [self-hosted, Linux, "${{ matrix.arch == 'amd64' && 'amd64' || 'arm64' }}"]
    env:
      TARGET_ARCH: ${{ matrix.arch }}
      DOCKER_DEFAULT_PLATFORM: linux/${{ matrix.arch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify native build architecture
        run: |
          [[ "$TARGET_ARCH" == amd64 || "$TARGET_ARCH" == arm64 ]]
          [[ "$(dpkg --print-architecture)" == "$TARGET_ARCH" ]]
          rm -rf dist
          mkdir -p dist

      - name: Build DAS-TOOLBOX
        run: make build


      - id: upload-artifact
        name: Upload das-toolbox artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BINARY_ARTIFACT_NAME }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: "error"

  das-cli-integration-tests:
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.architectures || '["amd64"]') }}
    runs-on: [self-hosted, Linux, "${{ matrix.arch == 'amd64' && 'amd64' || 'arm64' }}"]
    env:
      TARGET_ARCH: ${{ matrix.arch }}
    needs: 
      - build-das-toolbox
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Download das-toolbox artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.BINARY_ARTIFACT_NAME }}-${{ matrix.arch }}
          path: dist

      - name: Installing das-toolbox package
        run: |-
          [[ "$(dpkg --print-architecture)" == "$TARGET_ARCH" ]]
          shopt -s nullglob
          packages=(dist/*.deb)
          [[ ${#packages[@]} -eq 1 ]]
          [[ "$(dpkg-deb -f "${packages[0]}" Architecture)" == "$TARGET_ARCH" ]]
          [[ "$(dpkg-deb -f "${packages[0]}" Version)" == "$PACKAGE_VERSION" ]]
          sudo apt -y --autoremove --purge remove das-toolbox || true
          sudo apt -y --allow-downgrades install "./${packages[0]}"

      - name: Install requirements
        run: |-
          if [ -d "/tmp/bats-core" ]; then
            sudo rm -rf /tmp/bats-core
          fi
          cd /tmp
          git clone --depth=1 --branch v1.11.0 https://github.com/bats-core/bats-core.git
          cd bats-core
          sudo ./install.sh /usr/local
          cd -
          sudo apt -y update && sudo apt -y install socat lsof

          # Pin jq to 1.7+ to keep numeric serialization behavior stable in tests.
          case "$TARGET_ARCH" in
            amd64) checksum=5942c9b0934e510ee61eb3e30273f1b3fe2590df93933a93d7c58b81d19c8ff5 ;;
            arm64) checksum=4dd2d8a0661df0b22f1bb9a1f9830f06b6f3b8f7d91211a1ef5d7c4f06a8b4a5 ;;
            *) exit 1 ;;
          esac
          curl -fsSL -o /tmp/jq \
            "https://github.com/jqlang/jq/releases/download/jq-1.7.1/jq-linux-$TARGET_ARCH"
          echo "$checksum  /tmp/jq" | sha256sum --check --strict
          sudo install -m 0755 /tmp/jq /usr/local/bin/jq
          jq --version

      - name: Running integration tests
        run: make tests-local
        working-directory: das-cli

