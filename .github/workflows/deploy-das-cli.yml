---
name: DAS TOOLBOX Deployment

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version"
        required: true

jobs:
  # build-jupyter-notebook:
  #   runs-on: self-hosted
  #   if: github.ref == 'refs/heads/master'
  #   steps:
  #     - name: Checkout
  #       uses: actions/checkout@v4

  #     - name: Login to DockerHub
  #       if: success()
  #       uses: docker/login-action@v1
  #       with:
  #         username: ${{ secrets.DOCKER_USERNAME }}
  #         password: ${{ secrets.DOCKER_PASSWORD }}

  #     - name: Build and Push Docker Image
  #       uses: docker/build-push-action@v4
  #       with:
  #         context: das-cli
  #         file: das-cli/.docker/Dockerfile.jupyter-notebook
  #         push: true
  #         tags: trueagi/das:latest-jupyter-notebook

  build-with-code-quality:
    if: github.ref == 'refs/heads/master'
    uses: ./.github/workflows/run-das-cli-tests.yml
    with:
      version: ${{github.event.inputs.version}}
      binary-artifact-name: das-toolbox
      architectures: '["amd64", "arm64"]'

  tag:
    needs: build-with-code-quality
    if: github.ref == 'refs/heads/master'
    uses: singnet/das/.github/workflows/run-semver.yml@master
    with:
      version: ${{ github.event.inputs.version }}
      version-strategy: bump-version-from-variable-value
      job-image-namespace: trueagi
      job-image-version-semver: semantic-versioning
      main-branch: master
      version-tag-regex-pattern: /^\d+\.\d+\.\d+$/
      version-require-confirmation: "true"
      title: New version of das-toolbox
      deliverable: Debian package named das-toolbox
    secrets: inherit

  deploy-das-toolbox:
    runs-on: self-hosted
    if: github.ref == 'refs/heads/master'
    needs: build-with-code-quality
    env:
      PACKAGE_VERSION: ${{ inputs.version }}
      PACKAGES_SUBDIR: das-toolbox-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Download das-toolbox artifact
        uses: actions/download-artifact@v4
        with:
          pattern: das-toolbox-*
          path: ${{ runner.temp }}/${{ env.PACKAGES_SUBDIR }}

      - name: Copy files to server
        shell: bash
        env:
          PACKAGES_DIR: ${{ runner.temp }}/${{ env.PACKAGES_SUBDIR }}
          SERVER_USERNAME: ${{ secrets.SERVER_USERNAME }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_DEB_PACKAGES_PATH: ${{ vars.SERVER_DEB_PACKAGES_PATH }}
        run: |
          shopt -s nullglob
          packages=()
          for arch in amd64 arm64; do
            candidates=("$PACKAGES_DIR/das-toolbox-$arch/"*.deb)
            [[ ${#candidates[@]} -eq 1 ]]
            [[ "$(dpkg-deb -f "${candidates[0]}" Architecture)" == "$arch" ]]
            [[ "$(dpkg-deb -f "${candidates[0]}" Version)" == "$PACKAGE_VERSION" ]]
            packages+=("${candidates[0]}")
          done
          scp "${packages[@]}" "$SERVER_USERNAME@$SERVER_HOST:$SERVER_DEB_PACKAGES_PATH"
